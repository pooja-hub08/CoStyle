<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoStyle | Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fcf9f2; /* Creamy White Theme */
            color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .entry-container {
            text-align: center;
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(88, 28, 135, 0.1);
            max-width: 600px;
            width: 90%;
            border: 2px solid #f3e8ff;
        }
        .brand-title {
            font-size: 56px;
            font-weight: 900;
            color: #581c87; /* Rich Purple */
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .tagline {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 35px;
            font-weight: 500;
        }
        .enter-btn {
            background-color: #581c87; /* Bold Purple */
            color: #fcf9f2; /* Creamy White text */
            font-size: 18px;
            font-weight: 700;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(88, 28, 135, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .enter-btn:hover {
            background-color: #6b21a8;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(88, 28, 135, 0.4);
        }
        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="entry-container">
        <h1 class="brand-title">CoStyle</h1>
        <p class="tagline">Elevate Your Wardrobe & Lifestyle with Premium Curated Collections.</p>
        
        <!-- Click panravudan ungaloda main shopping store-ku (shop.html) pogum -->
        <a href="shop.html" class="enter-btn">Explore Collection →</a>
        
        <div class="footer-note">
            Secure Shopping &bull; Fast Delivery &bull; 24/7 Support
        </div>
    </div>

</body>
</html>
